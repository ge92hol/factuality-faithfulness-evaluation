[project]
name = "ffe-benchmark"
version = "1.0.0"
description = "Conflicting-evidence RAG evaluator benchmark (controlled five-answer comparison)"
requires-python = ">=3.11"
dependencies = [
  "ragchecker==0.1.9",
  "refchecker==0.2.17",
  "transformers==4.57.6",
  "numpy>=1.26",
  "pandas>=2",
  "pyyaml>=6",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
ffe = "benchmark.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
